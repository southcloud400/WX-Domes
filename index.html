        <div class="metair-login-buttons">
            <button id="metair-enable-button">

            <button id="metair-skip-button">
                NO

        </div>
    </div>
</div>

<div class="header">

</div>

<div class="preflight-control">

</div>

<div class="airport-input">

    <div class="panel">
