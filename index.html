<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Weather Dashboard</title>

<style>

body{
    margin:0px;
    font-family:sans-serif;
    background:#0d3b66;
    color:white;
}

.header{
    background:white;
    border-top:4px solid #0d3b66;
    border-bottom:12px solid #0d3b66;
    padding:8px 20px;
    margin-bottom:20px;
}

.header h2{
    margin:0;
    text-align:left;
    color:#0d3b66;
    font-style:italic;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.panel{

    border:1px solid #888;
    padding:5px;
    background:white;
    color:black;
}

.weather-image{
    width:100%;
    height:auto;
    display:block;
    cursor:pointer;
}

.asas-panel{
    position:relative;
    overflow:hidden;
}

#asas-image{
    filter:invert(1);
    opacity:1.0;
}

.asas-satellite-overlay{
    position:absolute;
    top:0;
    left:0;
    max-width:100%;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    filter:contrast(1.5);
    opacity:0.6;
    pointer-events:none;
    transform:translateX(-20%);
}

.asas-satellite-overlay img{
    width:100%;
    display:block;
}

.airport-input{
    margin-bottom:20px;
}

.airport-input input{
    width:80px;
    margin-right:10px;
    text-transform:uppercase;
}

.airport-input button{
    margin-left:10px;
}

#airport-display{
    margin-bottom:20px;
    font-weight:bold;
}

.modal {
    display:none;
    position:fixed;
    z-index:9999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
}

.modal img {
    width:95%;
    height:95%;
    object-fit:contain;
    display:block;
    margin:auto;
}

.modal.show {
    display:flex;
    justify-content:center;
    align-items:center;
}

.satellite-grid{
    display:grid;
    gap:0;
    cursor:pointer;
    transform:translateX(-20%);
}

.satellite-grid-3x2{
    grid-template-columns:1fr 1fr 1fr;
}

.satellite-grid img{
    width:100%;
    display:block;
}

.satellite-wrapper{
    position:relative;
    overflow:hidden;
}

.coastline-grid{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    pointer-events:none;
}

.coastline-grid img{
    width:100%;
    display:block;
}

.radar-grid{
    display:grid;
    gap:0;
    cursor:pointer;
}

.radar-grid-3x2{
    grid-template-columns:1fr 1fr 1fr;
}

.radar-grid img{
    width:100%;
    display:block;
}

.radar-wrapper{
    position:relative;
    overflow:hidden;
}

.radar-base-grid{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
}

.radar-grid{
    position:relative;
    z-index:2;
}

.radar-base-grid img{
    width:100%;
    display:block;
}

.radar-grid,
.radar-base-grid{
    transform:translateX(10%);
}

</style>

</head>

<body>

<div class="header">
    <h2>WX Domes</h2>
</div>

<div class="airport-input">

    <label>Departure</label>
    <input type="text" id="departure" value="RJOO">

    <label>Destination</label>
    <input type="text" id="destination" value="RJTT">

    <label>Alternate</label>
    <input type="text" id="alternate" value="RJBB">

    <button onclick="updateAirports()">
        更新
    </button>
    
    <button onclick="openMetar()">
    METAR/TAF
    </button>

</div>

<div id="airport-display">
    現在設定: RJOO → RJTT (ALT: RJBB)
</div>
<div class="grid">

    <div class="panel asas-panel">
          <img
            id="asas-image"
            src=""
            class="weather-image"
            onclick="enlargeImage(this)">

        <div class="asas-satellite-overlay">
            <img class="satellite-tile" data-x="5" data-y="2">
            <img class="satellite-tile" data-x="6" data-y="2">
            <img class="satellite-tile" data-x="7" data-y="2">

            <img class="satellite-tile" data-x="5" data-y="3">
            <img class="satellite-tile" data-x="6" data-y="3">
            <img class="satellite-tile" data-x="7" data-y="3">
        </div>
    </div>

    <div class="panel">
    <img
        id="fsas-image"
        src=""
        class="weather-image"
        onclick="enlargeImage(this)">
    </div>
    
    <div class="panel">
        <div class="satellite-wrapper">
            <div
                class="satellite-grid satellite-grid-3x2"
                onclick="openSatellitePage()">
                <img class="satellite-tile" data-x="5" data-y="2">
                <img class="satellite-tile" data-x="6" data-y="2">
                <img class="satellite-tile" data-x="7" data-y="2">
                <img class="satellite-tile" data-x="5" data-y="3">
                <img class="satellite-tile" data-x="6" data-y="3">
                <img class="satellite-tile" data-x="7" data-y="3">
            </div>
            <div class="coastline-grid">
                <img src="https://www.jma.go.jp/tile/jma/sat/4/10/4.png">
                <img src="https://www.jma.go.jp/tile/jma/sat/4/13/4.png">
                <img src="https://www.jma.go.jp/tile/jma/sat/4/14/4.png">

                <img src="https://www.jma.go.jp/tile/jma/sat/4/12/5.png">
                <img src="https://www.jma.go.jp/tile/jma/sat/4/13/5.png">
                <img src="https://www.jma.go.jp/tile/jma/sat/4/14/5.png">
            </div>
        </div>
    </div>
    
    <div class="panel">
        <div class="radar-wrapper">
            <div class="radar-base-grid radar-grid-3x2"></div>
            
            <div
                class="radar-grid radar-grid-3x2"
                onclick="openRadarPage()">
                <img class="radar-tile" data-x="13" data-y="5">
                <img class="radar-tile" data-x="14" data-y="5">
                <img class="radar-tile" data-x="15" data-y="5">

                <img class="radar-tile" data-x="13" data-y="6">
                <img class="radar-tile" data-x="14" data-y="6">
                <img class="radar-tile" data-x="15" data-y="6">
            </div>
        </div>
    </div>

    <div class="panel">
    <a href="https://weather.yahoo.co.jp/weather/zoomradar/" target="_blank">
        国内悪天解析を開く
    </a>
    </div>
    
    <div class="panel">
    <img
        src="https://www.data.jma.go.jp/airinfo/data/pict/fbjp/fbjp.png"
        class="weather-image">
    </div>

    <div class="panel">
    <h3>30分大気解析（断面）</h3>
    <img
    id="maiji-section-image"
    src=""
    class="weather-image"
    onclick="enlargeImage(this)">
    </div>
    
    <div class="panel">
    <h3>30分大気解析(平面)</h3>
    <img
    id="maiji-plane-image"
    src=""
    class="weather-image"
    onclick="enlargeImage(this)">
    </div>

</div>

<h2>METAR / TAF</h2>

<div id="metar-frame-container">

<iframe
    id="metar-frame"
    width="100%"
    height="600"
    src=""
>
</iframe>

</div>

<script>

function updateAirports(){

    const dep =
        document.getElementById("departure").value.toUpperCase();

    const dest =
        document.getElementById("destination").value.toUpperCase();

    const alt =
        document.getElementById("alternate").value.toUpperCase();

    document.getElementById("airport-display").innerText =
        `現在設定: ${dep} → ${dest} (ALT: ${alt})`;

}

function openMetar(){

    const dep =
        document.getElementById("departure").value.toUpperCase();

    const dest =
        document.getElementById("destination").value.toUpperCase();

    const alt =
        document.getElementById("alternate").value.toUpperCase();

    const url =
        `https://aviationweather.gov/data/metar/?ids=${dep},${dest},${alt}&hours=3&taf=1`;

    document.getElementById("metar-frame").src = url;

}

function enlargeImage(img){

    document.getElementById("modalImage").src = img.src;

    document
        .getElementById("imageModal")
        .classList.add("show");
}

function closeModal(){

    document
        .getElementById("imageModal")
        .classList.remove("show");
}

async function loadWeatherMaps(){

    const response =
        await fetch(
            "https://www.jma.go.jp/bosai/weather_map/data/list.json"
        );

    const data =
        await response.json();

    const asasFile =
    data.asia_monochrome.now[data.asia_monochrome.now.length - 1];

    const fsasFile =
        data.asia.ft24[0];

    const baseUrl =
        "https://www.jma.go.jp/bosai/weather_map/data/png/";

    document.getElementById("asas-image").src =
        baseUrl + asasFile;

    document.getElementById("fsas-image").src =
        baseUrl + fsasFile;

}

function formatTimestamp(date){
    const y = date.getUTCFullYear();
    const m = String(date.getUTCMonth() + 1).padStart(2, "0");
    const d = String(date.getUTCDate()).padStart(2, "0");
    const h = String(date.getUTCHours()).padStart(2, "0");
    const min = String(date.getUTCMinutes()).padStart(2, "0");

    return `${y}${m}${d}${h}${min}00`;
}

function imageExists(url){
    return new Promise((resolve) => {
        const img = new Image();

        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);

        img.src = url;
    });
}

async function loadMaijiPlane(){

    const baseUrl =
        "https://www.data.jma.go.jp/airinfo/data/pict/maiji/";

    const codes = [
        "WANLC101",
    ];

    const now = new Date();

    now.setUTCMinutes(
        Math.floor(now.getUTCMinutes() / 30) * 30,
        0,
        0
    );

    for(let i = 0; i < 96; i++){

        const targetTime =
            new Date(now.getTime() - i * 30 * 60 * 1000);

        const timestamp =
            formatTimestamp(targetTime);

        for(const code of codes){

            const url =
                `${baseUrl}${code}_RJTD_${timestamp}.PNG`;

            const exists =
                await imageExists(url);

            if(exists){

                document.getElementById("maiji-plane-image").src =
                    url;

                console.log("30分大気解析 平面:", url);

                return;
            }
        }
    }

    console.log("30分大気解析 平面が見つかりませんでした");
}

async function loadMaijiSection(){

    const baseUrl =
        "https://www.data.jma.go.jp/airinfo/data/pict/maiji/";

    const codes = [
        "WANLF145",
    ];

    const now = new Date();

    now.setUTCMinutes(
        Math.floor(now.getUTCMinutes() / 30) * 30,
        0,
        0
    );

    for(let i = 0; i < 96; i++){

        const targetTime =
            new Date(now.getTime() - i * 30 * 60 * 1000);

        const timestamp =
            formatTimestamp(targetTime);

        for(const code of codes){

            const url =
                `${baseUrl}${code}_RJTD_${timestamp}.PNG`;

            const exists =
                await imageExists(url);

            if(exists){

                document.getElementById("maiji-section-image").src =
                    url;

                console.log("30分大気解析 平面:", url);

                return;
            }
        }
    }

    console.log("30分大気解析 平面が見つかりませんでした");
}

async function loadSatelliteTime(){

    const response =
        await fetch(
            "https://www.jma.go.jp/bosai/himawari/data/satimg/targetTimes_jp.json"
        );

    const data =
        await response.json();

    const latestTime =
        data[data.length - 1].basetime;

    const testUrl =
        `https://www.jma.go.jp/bosai/himawari/data/satimg/${latestTime}/fd/${latestTime}/SND/ETC/3/6/2.jpg`;

    console.log(testUrl);

document.querySelectorAll(".satellite-tile").forEach((tile) => {
    const x = tile.dataset.x;
    const y = tile.dataset.y;

    tile.src =
        `https://www.jma.go.jp/bosai/himawari/data/satimg/${latestTime}/fd/${latestTime}/SND/ETC/3/${x}/${y}.jpg`;
});

}

async function loadRadarTime(){

    const response =
        await fetch(
            "https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json"
        );

    const data =
        await response.json();

    const latestTime =
        data[0].basetime;

    console.log(latestTime);

    document.querySelectorAll(".radar-tile").forEach((tile) => {

    const x = tile.dataset.x;
    const y = tile.dataset.y;

    tile.src =
        `https://www.jma.go.jp/bosai/jmatile/data/nowc/${latestTime}/none/${latestTime}/surf/hrpns/4/${x}/${y}.png`;

    });

    const radarBaseGrid =
    document.querySelector(".radar-base-grid");

radarBaseGrid.innerHTML = "";

const baseTiles = [
    [13, 5],
    [14, 5],
    [15, 5],
    [13, 6],
    [14, 6],
    [15, 6]
];

baseTiles.forEach(([x, y]) => {
    const img = document.createElement("img");

    img.src =
        `https://www.jma.go.jp/tile/gsi/pale/4/${x}/${y}.png`;

    radarBaseGrid.appendChild(img);
});

}

function openSatellitePage(){

    window.open(
        "https://www.jma.go.jp/bosai/map.html#5/34.5/137/&elem=strengthen&contents=himawari",
        "_blank"
    );

}

loadWeatherMaps();
loadMaijiPlane();
loadMaijiSection();
loadSatelliteTime();
loadRadarTime();

</script>

<div id="imageModal" class="modal" onclick="closeModal()">
    <img id="modalImage">
</div>

</body>
</html>
