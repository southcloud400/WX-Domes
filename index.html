<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Weather Dashboard</title>

<style>

body{
    margin:0px;
    font-family:sans-serif;
    background:#0d3b66;
    color:white;
}

.header{
    background:white;
    border-top:4px solid #0d3b66;
    border-bottom:12px solid #0d3b66;
    padding:8px 20px;
    margin-bottom:20px;
}

.header h2{
    margin:0;
    text-align:left;
    color:#0d3b66;
    font-style:italic;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.panel{

    border:1px solid #888;
    padding:5px;
    background:white;
    color:black;
}

.weather-image{
    width:100%;
    height:auto;
    display:block;
    cursor:pointer;
}

.asas-panel{
    position:relative;
    overflow:hidden;
}

.asas-overlay-window{
    position:relative;
    overflow:hidden;
    height:240px;
}

#asas-image{
    filter:invert(1);
    opacity:1.0;
    position:relative;
    top:-30px;
}

.asas-panel #asas-image{
    object-fit:cover;
}

.asas-satellite-overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    filter:contrast(1.5);
    opacity:0.6;
    pointer-events:none;
    transform:translateX(-20%);
}

.asas-satellite-overlay img{
    width:100%;
    display:block;
}

.fsas-panel{
    height:240px;
    overflow:hidden;
}

.fsas-panel img{
    position:relative;
    top:-30px;
}

.airport-input{
    margin-bottom:20px;
}

.airport-input input{
    width:80px;
    margin-right:10px;
    text-transform:uppercase;
}

.airport-input button{
    margin-left:10px;
}

#airport-display{
    margin-bottom:20px;
    font-weight:bold;
}

.modal {
    display:none;
    position:fixed;
    z-index:9999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
}

.modal img {
    width:95%;
    height:95%;
    object-fit:contain;
    display:block;
    margin:auto;
    filter:none;
    opacity:1;
}

.modal.show {
    display:flex;
    justify-content:center;
    align-items:center;
}

.satellite-grid{
    display:grid;
    gap:0;
    cursor:pointer;
    transform:translateX(-20%);
}

.satellite-grid-3x2{
    grid-template-columns:1fr 1fr 1fr;
}

.satellite-grid img{
    width:100%;
    display:block;
}

.satellite-wrapper{
    position:relative;
    overflow:hidden;
}

.coastline-grid{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    pointer-events:none;
}

.coastline-grid img{
    width:100%;
    display:block;
}

.radar-grid{
    display:grid;
    gap:0;
    cursor:pointer;
}

.radar-grid-3x2{
    grid-template-columns:1fr 1fr 1fr;
}

.radar-grid img{
    width:100%;
    display:block;
}

.radar-wrapper{
    position:relative;
    overflow:hidden;
}

.radar-base-grid{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
}

.radar-grid{
    position:relative;
    z-index:2;
}

.radar-base-grid img{
    width:100%;
    display:block;
}

.radar-grid,
.radar-base-grid{
    transform:translateX(10%);
}

.modal-content{
    width:95%;
    height:95%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:white;
}

.modal-content img{
    width:100%;
    height:90%;
    object-fit:contain;
}

#modalImage{
    filter:none;
}

#maiji-modal-control{
    width:90%;
    color:white;
    text-align:center;
    margin-top:8px;
}

#maiji-modal-slider{
    width:100%;
}

#maiji-modal-time{
    color:black;
    font-weight:bold;
    margin-bottom:6px;
}

</style>

</head>

<body>

<div class="header">
    <h2>WX Domes</h2>
</div>

<div class="airport-input">

    <label>Departure</label>
    <input type="text" id="departure" value="RJOO">

    <label>Destination</label>
    <input type="text" id="destination" value="RJTT">

    <label>Alternate</label>
    <input type="text" id="alternate" value="RJBB">

    <button onclick="updateAirports()">
        更新
    </button>
    
    <button onclick="openMetar()">
    METAR/TAF
    </button>

</div>

<div id="airport-display">
    現在設定: RJOO → RJTT (ALT: RJBB)
</div>
<div class="grid">

    <div class="panel asas-panel">

        <div class="asas-overlay-window">

            <img
                id="asas-image"
                src=""
                class="weather-image"
                onclick="enlargeImage(this)">

            <div class="asas-satellite-overlay">
                <img class="satellite-tile" data-x="5" data-y="2">
                <img class="satellite-tile" data-x="6" data-y="2">
                <img class="satellite-tile" data-x="7" data-y="2">

                <img class="satellite-tile" data-x="5" data-y="3">
                <img class="satellite-tile" data-x="6" data-y="3">
                <img class="satellite-tile" data-x="7" data-y="3">
            </div>

        </div>
    </div>

    <div class="panel fsas-panel">
    <img
        id="fsas-image"
        src=""
        class="weather-image"
        onclick="enlargeImage(this)">
    </div>
    
    <div class="panel">
         <div class="radar-wrapper">
            <div class="radar-base-grid radar-grid-3x2"></div>
            
            <div
                class="radar-grid radar-grid-3x2"
                onclick="openRadarPage()">
                <img class="radar-tile" data-x="13" data-y="5">
                <img class="radar-tile" data-x="14" data-y="5">
                <img class="radar-tile" data-x="15" data-y="5">

                <img class="radar-tile" data-x="13" data-y="6">
                <img class="radar-tile" data-x="14" data-y="6">
                <img class="radar-tile" data-x="15" data-y="6">
            </div>
        </div>   
    </div>
        <img
            src="https://www.imocwx.com/guid/gd300jp.png?2006"
            class="weather-image"
            onclick="enlargeImage(this)">

    <div class="panel">
        <a href="https://weather.yahoo.co.jp/weather/zoomradar/" target="_blank">
            国内悪天解析を開く
        </a>
    </div>
    
    <div class="panel">
        <img
            src="https://www.data.jma.go.jp/airinfo/data/pict/fbjp/fbjp.png"
            class="weather-image"
            onclick="enlargeImage(this)">
    </div>

    <div class="panel">

    <div style="margin-bottom:8px;">
        <label for="maiji-height-select">高度：</label>

        <select id="maiji-height-select">
            <option value="145">FL450</option>
            <option value="141">FL410</option>
            <option value="137">FL370</option>
            <option value="133">FL330</option>
            <option value="129">FL290</option>
            <option value="125">FL250</option>
            <option value="121">FL210</option>
            <option value="117">FL170</option>
            <option value="113">FL130</option>
            <option value="109">FL090</option>
            <option value="105">FL050</option>
            <option value="101">FL010</option>
        </select>
    </div>

    <img
        id="maiji-section-image"
        src=""
        class="weather-image"
        data-timeline="maiji-flat"
        onclick="enlargeImage(this)">
    </div>
    
    <div class="panel">
        
       <div style="margin-bottom:8px;">
        <label for="maiji-section-select">断面：</label>

        <select id="maiji-section-select">
            <option value="00">与那国-稚内</option>
            <option value="01">福岡-釧路</option>
            <option value="02">福岡-紋別</option>
            <option value="03">東京-稚内</option>
            <option value="04">東京-女満別</option>
            <option value="05">福岡-東京</option>
            <option value="06">鹿児島-東京</option>
            <option value="07">石垣-東京</option>
            <option value="08">与那国-高松</option>
            <option value="49">与那国-福岡</option>
            <option value="50">東経145.0度</option>
            <option value="51">東経142.5度</option>
            <option value="52">東経140.0度</option>
            <option value="53">東経137.5度</option>
            <option value="54">東経135.0度</option>
            <option value="55">東経132.5度</option>
            <option value="56">東経130.0度</option>
            <option value="57">東経127.5度</option>
            <option value="58">東経125.0度</option>
            <option value="59">東経122.5度</option>

        </select>
        
        <img
        id="maiji-plane-image"
        src=""
        class="weather-image"
        data-timeline="maiji-plane"
        onclick="enlargeImage(this)">

    </div>

</div>

<h2>METAR / TAF</h2>

<div id="metar-frame-container">

<iframe
    id="metar-frame"
    width="100%"
    height="600"
    src=""
>
</iframe>

</div>

<script>

let maijiPlaneTimeline = [];
let maijiFlatTimeline = [];
let currentMaijiTimeline = [];

function updateAirports(){

    const dep =
        document.getElementById("departure").value.toUpperCase();

    const dest =
        document.getElementById("destination").value.toUpperCase();

    const alt =
        document.getElementById("alternate").value.toUpperCase();

    document.getElementById("airport-display").innerText =
        `現在設定: ${dep} → ${dest} (ALT: ${alt})`;

}

function openMetar(){

    const dep =
        document.getElementById("departure").value.toUpperCase();

    const dest =
        document.getElementById("destination").value.toUpperCase();

    const alt =
        document.getElementById("alternate").value.toUpperCase();

    const url =
        `https://aviationweather.gov/data/metar/?ids=${dep},${dest},${alt}&hours=3&taf=1`;

    document.getElementById("metar-frame").src = url;

}

function enlargeImage(img){

    console.log(img);

    document.getElementById("modalImage").src = img.src;

    const control =
        document.getElementById("maiji-modal-control");

    if(
    img.dataset.timeline === "maiji-plane" ||
    img.dataset.timeline === "maiji-flat"
    ){

    const timeline =
        img.dataset.timeline === "maiji-flat"
            ? maijiFlatTimeline
            : maijiPlaneTimeline;

    currentMaijiTimeline = timeline;

    control.style.display = "block";

    const slider =
        document.getElementById("maiji-modal-slider");

    slider.max =
        timeline.length - 1;

    slider.value =
        timeline.length - 1;

    document.getElementById("maiji-modal-time").innerText =
        formatDisplayTime(
            timeline[0].timestamp
        );

    }else{

    control.style.display = "none";
    }

    document
        .getElementById("imageModal")
        .classList.add("show");
}

function closeModal(){

    document
        .getElementById("imageModal")
        .classList.remove("show");
}

async function loadWeatherMaps(){

    const response =
        await fetch(
            "https://www.jma.go.jp/bosai/weather_map/data/list.json"
        );

    const data =
        await response.json();

    const asasFile =
    data.asia_monochrome.now[data.asia_monochrome.now.length - 1];

    const fsasFile =
        data.asia.ft24[0];

    const baseUrl =
        "https://www.jma.go.jp/bosai/weather_map/data/png/";

    document.getElementById("asas-image").src =
        baseUrl + asasFile;

    document.getElementById("fsas-image").src =
        baseUrl + fsasFile;

}

function formatTimestamp(date){
    const y = date.getUTCFullYear();
    const m = String(date.getUTCMonth() + 1).padStart(2, "0");
    const d = String(date.getUTCDate()).padStart(2, "0");
    const h = String(date.getUTCHours()).padStart(2, "0");
    const min = String(date.getUTCMinutes()).padStart(2, "0");

    return `${y}${m}${d}${h}${min}00`;
}

function formatDisplayTime(timestamp){

    return (
        timestamp.slice(0,4) + "/" +
        timestamp.slice(4,6) + "/" +
        timestamp.slice(6,8) + " " +
        timestamp.slice(8,10) + ":" +
        timestamp.slice(10,12) +
        " UTC"
    );
}

async function findLatestMaijiImage(code){

    const baseUrl =
        "https://www.data.jma.go.jp/airinfo/data/pict/maiji/";

    const now = new Date();

    now.setUTCMinutes(
        Math.floor(now.getUTCMinutes() / 30) * 30,
        0,
        0
    );

    for(let i = 0; i < 96; i++){

        const targetTime =
            new Date(now.getTime() - i * 30 * 60 * 1000);

        const timestamp =
            formatTimestamp(targetTime);

        const url =
            `${baseUrl}${code}_RJTD_${timestamp}.PNG`;

        const exists =
            await imageExists(url);

        if(exists){

            return {
                code: code,
                time: targetTime,
                timestamp: timestamp,
                url: url
            };
        }
    }

    return null;
}

async function loadMaijiTimelineTest(){

    const selectedSection =
        document.getElementById("maiji-section-select").value;

    const imageCode =
        `WANLC1${selectedSection}`;

    const latest =
        await findLatestMaijiImage(imageCode);

    if(!latest){
        console.log("毎時大気解析の最新画像が見つかりません");
        return;
    }

    const timeline = [];

    for(let i = 0; i <= 6; i++){

        const targetTime =
            new Date(latest.time.getTime() - i * 60 * 60 * 1000);

        const timestamp =
            formatTimestamp(targetTime);

        const url =
            `https://www.data.jma.go.jp/airinfo/data/pict/maiji/${imageCode}_RJTD_${timestamp}.PNG`;
        const exists =
            await imageExists(url);

        if(exists){
            timeline.push({
                index: timeline.length,
                timestamp: timestamp,
                url: url
            });
        }
    }

    console.log("存在確認済みタイムライン", timeline);

    maijiPlaneTimeline = timeline;

    if(timeline.length > 0){
    document.getElementById("maiji-plane-image").src = timeline[0].url;

    const slider =
        document.getElementById("maiji-modal-slider");

    slider.max =
        timeline.length - 1;

    slider.value =
        timeline.length - 1;

    document.getElementById("maiji-modal-time").innerText =
        formatDisplayTime(timeline[0].timestamp);
}

}


function imageExists(url){
    return new Promise((resolve) => {
        const img = new Image();

        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);

        img.src = url;
    });
}

function openRadarPage(){
    window.open(
        "https://www.jma.go.jp/bosai/nowc/",
        "_blank"
    );
}

async function loadMaijiPlane(){

    const baseUrl =
        "https://www.data.jma.go.jp/airinfo/data/pict/maiji/";

    const codes = [
        "WANLC101",
    ];

    const now = new Date();

    now.setUTCMinutes(
        Math.floor(now.getUTCMinutes() / 30) * 30,
        0,
        0
    );

    for(let i = 0; i < 96; i++){

        const targetTime =
            new Date(now.getTime() - i * 30 * 60 * 1000);

        const timestamp =
            formatTimestamp(targetTime);

        for(const code of codes){

            const url =
                `${baseUrl}${code}_RJTD_${timestamp}.PNG`;

            const exists =
                await imageExists(url);

            if(exists){

                document.getElementById("maiji-plane-image").src =
                    url;


                return;
            }
        }
    }

}

async function loadMaijiSection(){

    const selectedHeight =
        document.getElementById("maiji-height-select").value;

    const imageCode =
        `WANLF${selectedHeight}`;

    const latest =
        await findLatestMaijiImage(imageCode);

    if(!latest){
        console.log("毎時大気解析（平面）の最新画像が見つかりません");
        return;
    }

    const timeline = [];

    for(let i = 0; i <= 6; i++){

        const targetTime =
            new Date(latest.time.getTime() - i * 60 * 60 * 1000);

        const timestamp =
            formatTimestamp(targetTime);

        const url =
            `https://www.data.jma.go.jp/airinfo/data/pict/maiji/${imageCode}_RJTD_${timestamp}.PNG`;

        const exists =
            await imageExists(url);

        if(exists){
            timeline.push({
                index: timeline.length,
                timestamp: timestamp,
                url: url
            });
        }
    }

    maijiFlatTimeline = timeline;

    if(timeline.length > 0){
        document.getElementById("maiji-section-image").src = timeline[0].url;
    }
}

async function loadSatelliteTime(){

    const response =
        await fetch(
            "https://www.jma.go.jp/bosai/himawari/data/satimg/targetTimes_jp.json"
        );

    const data =
        await response.json();

    const latestTime =
        data[data.length - 1].basetime;

    const testUrl =
        `https://www.jma.go.jp/bosai/himawari/data/satimg/${latestTime}/fd/${latestTime}/SND/ETC/3/6/2.jpg`;



document.querySelectorAll(".satellite-tile").forEach((tile) => {
    const x = tile.dataset.x;
    const y = tile.dataset.y;

    tile.src =
        `https://www.jma.go.jp/bosai/himawari/data/satimg/${latestTime}/fd/${latestTime}/SND/ETC/3/${x}/${y}.jpg`;
});

}

async function loadRadarTime(){

    const response =
        await fetch(
            "https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json"
        );

    const data =
        await response.json();

    const latestTime =
        data[0].basetime;


    document.querySelectorAll(".radar-tile").forEach((tile) => {

    const x = tile.dataset.x;
    const y = tile.dataset.y;

    tile.src =
        `https://www.jma.go.jp/bosai/jmatile/data/nowc/${latestTime}/none/${latestTime}/surf/hrpns/4/${x}/${y}.png`;

    });

    const radarBaseGrid =
    document.querySelector(".radar-base-grid");

radarBaseGrid.innerHTML = "";

const baseTiles = [
    [13, 5],
    [14, 5],
    [15, 5],
    [13, 6],
    [14, 6],
    [15, 6]
];

baseTiles.forEach(([x, y]) => {
    const img = document.createElement("img");

    img.src =
        `https://www.jma.go.jp/tile/gsi/pale/4/${x}/${y}.png`;

    radarBaseGrid.appendChild(img);
});

}

function openSatellitePage(){

    window.open(
        "https://www.jma.go.jp/bosai/map.html#5/34.5/137/&elem=strengthen&contents=himawari",
        "_blank"
    );

}

loadWeatherMaps();
loadMaijiPlane();
loadMaijiSection();
loadSatelliteTime();
loadRadarTime();
loadMaijiTimelineTest();

document.getElementById("maiji-height-select")
    .addEventListener("change", () => {
        loadMaijiSection();
    });

document.getElementById("maiji-section-select").addEventListener("change", () => {
    loadMaijiTimelineTest();
});

</script>

<div id="imageModal" class="modal" onclick="closeModal()">

    <div class="modal-content" onclick="event.stopPropagation()">

        <img id="modalImage">

        <div id="maiji-modal-control" style="display:none;">
            <div id="maiji-modal-time"></div>

            <input
                type="range"
                id="maiji-modal-slider"
                min="0"
                max="0"
                value="0">
        </div>

    </div>

</div>

<script>
document
    .getElementById("maiji-modal-slider")
    .addEventListener("input", function(){

        const index =
        currentMaijiTimeline.length - 1 -
        Number(this.value);

        document.getElementById("modalImage").src =
            currentMaijiTimeline[index].url;

        document.getElementById("maiji-modal-time").innerText =
            formatDisplayTime(currentMaijiTimeline[index].timestamp);

    });
</script>

</body>
</html>
