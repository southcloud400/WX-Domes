<script>

let lightningTimeline = [];
let maijiPlaneTimeline = [];
let maijiFlatTimeline = [];
let currentMaijiTimeline = [];
let preflightMode = false;

async function loadMetarText(){

    const ids =
    document
        .getElementById("airport-list")
        .value
        .toUpperCase()
        .replace(/\s+/g, "");

    const url =
        `https://aviationweather.gov/api/data/metar?ids=${ids}&format=raw&taf=true&hours=3`;

    const response =
        await fetch(url);

    const text =
        await response.text();

    document.getElementById("metar-text").innerText =
        formatMetarTafText(text);
}

function formatMetarTafText(text){

    const lines =
        text
            .split("\n")
            .map(line => line.trim())
            .filter(line => line !== "");

    const groups = {};

    lines.forEach(line => {

        const match =
            line.match(/^(METAR|TAF)\s+([A-Z]{4})/);

        if(!match){
            return;
        }

        const type =
            match[1];

        const airport =
            match[2];

        if(!groups[airport]){
            groups[airport] = {
                metar: [],
                taf: []
            };
        }

        if(type === "METAR"){
            groups[airport].metar.push(line);
        }

        if(type === "TAF"){
            groups[airport].taf.push(line);
        }
    });

    let output = "";

    Object.keys(groups).forEach(airport => {

        output += `【${airport}】\n`;

        output += "-METAR-\n";
        output += groups[airport].metar.slice(0, 3).join("\n");
        output += "\n\n";

        output += "-TAF-\n";
        output += groups[airport].taf.join("\n");
        output += "\n\n--------------------\n\n";
    });

    return output;
}

function enlargeImage(img){

    document.getElementById("modalImage").src = img.src;

    const control =
        document.getElementById("maiji-modal-control");

    if(
        img.dataset.timeline === "maiji-plane" ||
        img.dataset.timeline === "maiji-flat" ||
        img.dataset.timeline === "lightning"
    ){

        let timeline;

        if(img.dataset.timeline === "maiji-flat"){
            timeline = maijiFlatTimeline;
        }else if(img.dataset.timeline === "lightning"){
            timeline = lightningTimeline;
        }else{
            timeline = maijiPlaneTimeline;
        }{

            currentMaijiTimeline = timeline;

            control.style.display = "block";

            const slider =
                document.getElementById("maiji-modal-slider");

            slider.max =
                timeline.length - 1;

            slider.value =
                timeline.length - 1;

            document.getElementById("maiji-modal-time").innerText =
            timeline[0].timestamp
                ? formatDisplayTime(timeline[0].timestamp)
                : timeline[0].label;
                }

    }else{

        control.style.display = "none";
    }

    document
        .getElementById("imageModal")
        .classList.add("show");
}

function closeModal(){

    document
        .getElementById("imageModal")
        .classList.remove("show");
}

async function loadWeatherMaps(){

    const response =
        await fetch(
            "https://www.jma.go.jp/bosai/weather_map/data/list.json"
        );

    const data =
        await response.json();
    
    console.log(Object.keys(data));

    const asasFile =
         data.near_monochrome.now[data.near_monochrome.now.length - 1
         ];

    const fsasFile =
        data.asia.ft24[0];

    const baseUrl =
        "https://www.jma.go.jp/bosai/weather_map/data/png/";

    document.getElementById("asas-image").src =
        baseUrl + asasFile;

    document.getElementById("fsas-image").src =
        baseUrl + fsasFile;

}

function formatTimestamp(date){
    const y = date.getUTCFullYear();
    const m = String(date.getUTCMonth() + 1).padStart(2, "0");
    const d = String(date.getUTCDate()).padStart(2, "0");
    const h = String(date.getUTCHours()).padStart(2, "0");
    const min = String(date.getUTCMinutes()).padStart(2, "0");

    return `${y}${m}${d}${h}${min}00`;
}

function formatDisplayTime(timestamp){

    return (
        timestamp.slice(0,4) + "/" +
        timestamp.slice(4,6) + "/" +
        timestamp.slice(6,8) + " " +
        timestamp.slice(8,10) + ":" +
        timestamp.slice(10,12) +
        " UTC"
    );
}


function formatJmaTileTime(basetime){

    return (
        basetime.slice(0,4) + "/" +
        basetime.slice(4,6) + "/" +
        basetime.slice(6,8) + " " +
        basetime.slice(8,10) + ":" +
        basetime.slice(10,12) +
        " UTC"
    );
}

function loadRouteForecastSection(){

    const availableTime =

async function loadLightningImage(){

    const area =
        document.getElementById("lightning-area-select").value;

    const timeline = [];

    for(let i = 0; i <= 9; i++){

        const fileNumber =
            String(i).padStart(2, "0");

        const url =
            `https://www.imocwx.com/guid/gd3${fileNumber}${area}.png?${Date.now()}`;

        const exists =
            await imageExists(url);

        if(exists){
            timeline.push({
                index: timeline.length,
                label: `${i}時間後`,
                url: url
            });
        }
    }

    lightningTimeline = timeline;

    if(timeline.length > 0){
        document.getElementById("lightning-image").src =
            timeline[0].url;

        document.getElementById("lightning-time").innerText =
            `発雷確率 ${timeline[0].label}`;
    }
}

async function findLatestMaijiImage(code){

    const baseUrl =
        "https://www.data.jma.go.jp/airinfo/data/pict/maiji/";

    const now = new Date();

    now.setUTCMinutes(
        Math.floor(now.getUTCMinutes() / 30) * 30,
        0,
        0
    );

    for(let i = 0; i < 96; i++){

        const targetTime =
            new Date(now.getTime() - i * 30 * 60 * 1000);

        const timestamp =
            formatTimestamp(targetTime);

        const url =
            `${baseUrl}${code}_RJTD_${timestamp}.PNG`;

        const exists =
            await imageExists(url);

        if(exists){

            return {
                code: code,
                time: targetTime,
                timestamp: timestamp,
                url: url
            };
        }
    }

    return null;
}

function imageExists(url){
    return new Promise((resolve) => {
        const img = new Image();

        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);

        img.src = url;
    });
}

        await response.json();

    const latest =
        data[data.length - 1];

        latest.basetime;

    const validTime =
        latest.validtime;
    
    document.getElementById("satellite-time").innerText =
        "Satellite: " + formatJmaTileTime(validTime);

    document.querySelectorAll(".satellite-tile").forEach((tile) => {
        const x = tile.dataset.x;

        tile.src =
            `https://www.jma.go.jp/bosai/himawari/data/satimg/${baseTime}/fd/${validTime}/SND/ETC/4/${x}/${y}.jpg`;
    });
}
