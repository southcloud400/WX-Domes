<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Weather Dashboard</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="header">
    <h2>WX Domes.</h2>
</div>

<div class="preflight-control">
    <button id="preflight-toggle">
        Preflight OFF
    </button>
</div>

<div class="airport-input">

    <label>Airport</label>

    <input
        type="text"
        id="airport-list"
        value="RJOO,RJTT,RJBB"
        style="width:220px; text-transform:uppercase;">

    <button id="metar-update-button">
        Update
    </button>

</div>


<div class="metar-panel">

    <pre id="metar-text">
Loading...
    </pre>

</div>

<div class="preflight-panel">

    <div class="preflight-top-row">

        <div class="panel">
            <div class="panel-control">
                <label>全国航空気象解説(飛行場)</label>
            </div>

            <img
                id="aviation-commentary-image"
                src=""
                class="weather-image">

        </div>

        <div class="panel">
            <div class="panel-control">
                <label>AI Summary</label>
            </div>

            <div class="preflight-summary">
                AIサマリーをここに表示予定
            </div>
        </div>

    </div>

    <div class="preflight-grid">

    <div class="panel">
        <div class="panel-control">
            <label>全国航空気象解説(福岡FIR)</label>
        </div>
        <img
            id="aviation-fir-commentary-image"
            src=""
            class="weather-image">

    </div>

    <div class="panel">
        <div class="panel-control">
            <label>国内航空路予想断面図</label>
        </div>
        <img
            id="route-forecast-section-image"
            src=""
            class="weather-image">

    </div>

    <div class="panel">
        <div class="panel-control">
            <label>FXFE502</label>
        </div>

        <img
            id="fxfe502-image"
            class="weather-image">
        </div>

    <div class="panel">
        <div class="panel-control">
            <label>FXFE504</label>
        </div>

        <img
            id="fxfe504-image"
            class="weather-image">
    </div>

    <div class="panel">
        <div class="panel-control">
            <label>FXFE5782</label>
        </div>

        <img
            id="fxfe5782-image"
            class="weather-image">
    </div>

   <div class="panel">
        <div class="panel-control">
            <label>FXFE5784</label>
        </div>

        <img
            id="fxfe5784-image"
            class="weather-image">
        </div>

    <div class="panel">
        <div class="panel-control">

            <label id="low-level-sigwx-title">
                下層悪天予想図
            </label>

           <select
                id="low-level-sigwx-select">

                <option value="fbsp39" selected>北海道</option>
                <option value="fbsn39">東北</option>
                <option value="fbtk39">東日本</option>
                <option value="fbos39">西日本</option>
                <option value="fbkg39">奄美</option>
                <option value="fbok39">沖縄</option>

            </select>

        </div>

        <img
            id="low-level-sigwx-image"
            src=""
            class="weather-image">
    </div>

    <div class="panel">
        <div class="panel-control">
            <label>FXJP854</label>
        </div>

        <img
            id="fxjp854-image"
            class="weather-image">
    </div>

</div>

</div>


<div class="grid">

    <div class="panel">
        <div class="panel-control">
            <a
            id="satellite-time"
            href="https://www.jma.go.jp/bosai/map.html#5/34.5/137/&elem=strengthen&contents=himawari"
            target="_blank">
            </a>
        </div>
      
        <div class="asas-test-layer-box">

            <img
                id="asas-image"
                src=""
                class="weather-image">

            <div id="asas-cloud-grid">

                <img class="satellite-tile" data-x="13" data-y="5">
                <img class="satellite-tile" data-x="14" data-y="5">
                <img class="satellite-tile" data-x="15" data-y="5">

                <img class="satellite-tile" data-x="13" data-y="6">
                <img class="satellite-tile" data-x="14" data-y="6">
                <img class="satellite-tile" data-x="15" data-y="6">

                <img class="satellite-tile" data-x="13" data-y="7">
                <img class="satellite-tile" data-x="14" data-y="7">
                <img class="satellite-tile" data-x="15" data-y="7">

            </div>

        </div>
    </div>

    <div class="panel">
        
         <div class="panel-control">
            <label>FSAS +24</label>
        </div>
        
        <img
            id="fsas-image"
            src=""
            class="weather-image">

    </div>
    
    <div class="panel">
        <div class="panel-control">
            <span id="radar-time"></span>
        </div>
         <div class="radar-wrapper">
            <div class="radar-base-grid radar-grid-3x3"></div>
            
            <div
                class="radar-grid radar-grid-3x3">
                <img class="radar-tile" data-x="13" data-y="5">
                <img class="radar-tile" data-x="14" data-y="5">
                <img class="radar-tile" data-x="15" data-y="5">

                <img class="radar-tile" data-x="13" data-y="6">
                <img class="radar-tile" data-x="14" data-y="6">
                <img class="radar-tile" data-x="15" data-y="6">

                <img class="radar-tile" data-x="13" data-y="7">
                <img class="radar-tile" data-x="14" data-y="7">
                <img class="radar-tile" data-x="15" data-y="7">
            </div>
        </div> 
    </div>

<div class="panel">
    <div class="panel-control">
        <span id="lightning-time"></span>

        <select id="lightning-area-select">
            <option value="jp">日本</option>
            <option value="sjp">南日本</option>
        </select>

    </div>

    <img
        id="lightning-image"
        src=""
        class="weather-image"
        data-timeline="lightning">
</div>

<div class="panel">
    <a href="https://weather.yahoo.co.jp/weather/zoomradar/" target="_blank">
        国内悪天解析を開く
    </a>
</div>
    
    <div class="panel">
        <img
            src="https://www.data.jma.go.jp/airinfo/data/pict/fbjp/fbjp.png"
            class="weather-image">
    </div>

<div class="panel">

    <div class="panel-control">
        <label for="maiji-height-select">高度：</label>

        <select id="maiji-height-select">
            <option value="145">FL450</option> 
            <option value="141">FL410</option> 
            <option value="137">FL370</option> 
            <option value="133">FL330</option> 
            <option value="129">FL290</option> 
            <option value="125">FL250</option> 
            <option value="121">FL210</option> 
            <option value="117">FL170</option> 
            <option value="113">FL130</option> 
            <option value="109">FL090</option> 
            <option value="105">FL050</option> 
            <option value="101">FL010</option>
        </select>
    </div>

    <img
        id="maiji-section-image"
        src=""
        class="weather-image"
        data-timeline="maiji-flat">

</div>

<div class="panel">

    <div class="panel-control">
        <label for="maiji-section-select">断面：</label>

        <select id="maiji-section-select">
            <option value="WANLC199">与那国-稚内</option> 
            <option value="WANLC101">福岡-釧路</option> 
            <option value="WANLC102">福岡-紋別</option>
             <option value="WANLC103">東京-稚内</option>
              <option value="WANLC104">東京-女満別</option>
               <option value="WANLC105">福岡-東京</option> 
               <option value="WANLC106">鹿児島-東京</option> 
               <option value="WANLC107">石垣-東京</option> 
               <option value="WANLC108">与那国-高松</option>
               <option value="WANLC109">与那国-福岡</option> 
               <option value="WANLC150">東経145.0度</option>
               <option value="WANLC151">東経142.5度</option> 
               <option value="WANLC152">東経140.0度</option> 
               <option value="WANLC153">東経137.5度</option> 
               <option value="WANLC154">東経135.0度</option> 
               <option value="WANLC155">東経132.5度</option> 
               <option value="WANLC156">東経130.0度</option> 
               <option value="WANLC157">東経127.5度</option> 
               <option value="WANLC158">東経125.0度</option> 
               <option value="WANLC159">東経122.5度</option>
        </select>
    </div>

    <img
        id="maiji-plane-image"
        src=""
        class="weather-image"
        data-timeline="maiji-plane">

</div>

</div>

<div id="imageModal" class="modal">

    <div class="modal-content">

        <button id="modal-close-btn">
        ✕
        </button>

        <img id="modalImage">

        <div id="maiji-modal-control" style="display:none;">
            <div id="maiji-modal-time"></div>

            <input
                type="range"
                id="maiji-modal-slider"
                min="0"
                max="0"
                value="0">
        </div>

    </div>

</div>

<script src="main.js"></script>
<script src="js/metar.js"></script>
<script src="js/maiji.js"></script>
<script src="js/lightning.js"></script>
<script src="js/preflight.js"></script>
<script src="js/modal.js"></script>

<script>
    window.addEventListener("DOMContentLoaded", () => {
        initializeApp();
    });
</script>

</body>
</html>
